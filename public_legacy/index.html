<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <script>
        // 기존 구형 서비스워커 및 캐시 완전 삭제
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (let registration of registrations) {
                    registration.unregister();
                }
            });
        }
        if ('caches' in window) {
            caches.keys().then(function(names) {
                for (let name of names) caches.delete(name);
            });
        }
    </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; padding: 80px 20px; color: #57606a;">
    <h2 style="color: #24292f; margin-bottom: 10px;">페이지를 찾을 수 없습니다 (404)</h2>
    <p style="font-size: 0.95rem;">요청하신 주소는 더 이상 사용되지 않거나 종료된 페이지입니다.</p>
</body>
</html>
