name: Crawl Hot (D+0~3)

on:
  schedule:
    # 08:10, 10:10, 12:10, 16:10, 18:10, 19:10, 20:10, 22:10 KST
    - cron: '10 23,1,3,7,9,10,11,13 * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Create Service Account Key
      shell: python
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      run: |
        import os
        import base64
        
        secret_val = os.environ.get("GCP_SA_KEY", "")
        if not secret_val:
            print("ERROR: Secret is empty!")
            exit(1)
            
        try:
            decoded = base64.b64decode(secret_val.strip()).decode('utf-8')
            content = decoded
        except Exception:
            content = secret_val

        import json
        try:
            json.loads(content)
        except Exception as e:
            print(f"ERROR: Content is NOT valid JSON: {e}")
            exit(1)

        with open("service-account.json", "w") as f:
            f.write(content)

    - name: Run Crawler (D+0 to D+3)
      env:
        PROJECT_ID: "golf-ai-480805"
        CRAWL_START_DAY: "0"
        CRAWL_END_DAY: "3"
        TEESCAN_PROXY_URL: ${{ secrets.TEESCAN_PROXY_URL }}
        GPANG_PROXY_WORKER: ${{ secrets.TEESCAN_PROXY_URL }}
      run: |
        python ingest_data.py
