name: Refresh Pickup Cache

on:
  schedule:
    # 매일 한국시간 오전 9시 40분 (UTC 00:40) 실행 — fallback용
    # 주요 갱신은 crawl_hot 완료 후 ingest_data.py에서 직접 트리거
    - cron: '40 0 * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  refresh-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger refresh API
        run: |
          curl -f "https://golf-ai-480805.web.app/api/internal/refresh_pickup?token=nawabari-sync-2026"
