name: Refresh Pickup Cache

on:
  schedule:
    # 매일 한국시간 오전 9시 10분 (UTC 00:10) 실행
    - cron: '10 0 * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  refresh-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger refresh API
        run: |
          curl -f "https://nawabari.golf/api/internal/refresh_pickup?token=nawabari-sync-2026"
