name: Hourly Weather Update

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'ingest_weather.py'
      - 'weather_utils.py'

jobs:
  weather:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Create Service Account Key
      shell: python
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      run: |
        import os
        import base64
        import json
        
        secret_val = os.environ.get("GCP_SA_KEY", "")
        
        if not secret_val:
            print("ERROR: Secret is empty!")
            exit(1)
            
        try:
            # Try to decode as base64
            decoded = base64.b64decode(secret_val.strip()).decode('utf-8')
            content = decoded
        except Exception:
            # Fallback: use raw content
            content = secret_val

        # Verify JSON
        try:
            json.loads(content)
        except Exception as e:
            print(f"ERROR: Invalid JSON: {e}")
            exit(1)

        with open("service-account.json", "w") as f:
            f.write(content)

    - name: Run Weather Ingestion
      env:
        PROJECT_ID: "golf-ai-480805"
      run: |
        python ingest_weather.py
