name: Daily Golf Crawl

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  crawl:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Create Service Account Key
      shell: python
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      run: |
        import os
        import base64
        
        try:
            # Try to decode as base64
            decoded = base64.b64decode(os.environ["GCP_SA_KEY"]).decode('utf-8')
            with open("service-account.json", "w") as f:
                f.write(decoded)
        except Exception:
            # Fallback: write as is (if user didn't update secret yet)
            with open("service-account.json", "w") as f:
                f.write(os.environ["GCP_SA_KEY"])

    - name: Run Crawler
      env:
        PROJECT_ID: "golf-ai-480805"
        # Add other env vars if needed
      run: |
        python ingest_data.py
