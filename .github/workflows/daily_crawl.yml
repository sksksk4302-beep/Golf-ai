name: Daily Golf Crawl

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main

jobs:
  crawl:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Create Service Account Key
      shell: python
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      run: |
        import os
        import base64
        
        secret_val = os.environ.get("GCP_SA_KEY", "")
        print(f"DEBUG: Secret length: {len(secret_val)}")
        
        if not secret_val:
            print("ERROR: Secret is empty!")
            exit(1)
            
        try:
            # Try to decode as base64
            # Strip whitespace just in case
            decoded = base64.b64decode(secret_val.strip()).decode('utf-8')
            print("DEBUG: Successfully decoded base64")
            content = decoded
        except Exception as e:
            print(f"DEBUG: Base64 decode failed ({e}), using raw content")
            content = secret_val

        # Verify file content is valid JSON
        import json
        try:
            json.loads(content)
            print("DEBUG: Content is valid JSON")
        except Exception as e:
            print(f"ERROR: Content is NOT valid JSON: {e}")
            print(f"DEBUG: Content (first 100 chars): {content[:100]}")
            # If content is empty, print that explicitly
            if not content:
                print("DEBUG: Content is EMPTY string")
            exit(1)

        with open("service-account.json", "w") as f:
            f.write(content)
            
        # Verify file
        with open("service-account.json", "r") as f:
            first_line = f.readline()
            print(f"DEBUG: First line of file: {first_line[:50]}...")

    - name: Run Crawler
      env:
        PROJECT_ID: "golf-ai-480805"
        # Add other env vars if needed
      run: |
        python ingest_data.py
