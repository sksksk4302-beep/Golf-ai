name: Send Kakao Alert (09:30 KST)

on:
  schedule:
    # 00:30 UTC = 09:30 KST
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  alert:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install requests firebase-admin google-auth

    - name: Create Service Account Key
      shell: python
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      run: |
        import os
        import base64
        
        secret_val = os.environ.get("GCP_SA_KEY", "")
        if not secret_val:
            print("ERROR: Secret is empty!")
            exit(1)
            
        try:
            decoded = base64.b64decode(secret_val.strip()).decode('utf-8')
            content = decoded
        except Exception:
            content = secret_val

        with open("service-account.json", "w") as f:
            f.write(content)

    - name: Run Kakao Alert Script
      run: |
        python send_kakao_alert.py
