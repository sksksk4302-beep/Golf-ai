steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/golf-repo/golf-app', '.']

  # 2. Push the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/golf-repo/golf-app']

  # 3. Deploy Cloud Run Job (Hot-A) - D+0~D+1 Crawler
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'hot-a-job'
      - '--image'
      - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/golf-repo/golf-app'
      - '--region'
      - 'asia-northeast3'
      - '--tasks'
      - '1'
      - '--max-retries'
      - '0'
      - '--task-timeout'
      - '15m'
      - '--set-env-vars'
      - 'PROJECT_ID=golf-ai-480805,CRAWL_START_DAY=0,CRAWL_END_DAY=1,TEESCAN_PROXY_URL=https://teescan-proxy.sksksk4302.workers.dev,GPANG_PROXY_WORKER=https://teescan-proxy.sksksk4302.workers.dev'
      - '--command'
      - 'python'
      - '--args'
      - 'ingest_data.py'

  # 5. Deploy Cloud Run Job (Archive) - History Archive
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'archive-job'
      - '--image'
      - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/golf-repo/golf-app'
      - '--region'
      - 'asia-northeast3'
      - '--tasks'
      - '1'
      - '--max-retries'
      - '0'
      - '--task-timeout'
      - '30m'
      - '--command'
      - 'python'
      - '--args'
      - 'archive_history.py'

  # 5.5 Deploy Cloud Run Job (Kakao Alert)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'kakao-alert-job'
      - '--image'
      - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/golf-repo/golf-app'
      - '--region'
      - 'asia-northeast3'
      - '--tasks'
      - '1'
      - '--max-retries'
      - '0'
      - '--task-timeout'
      - '5m'
      - '--command'
      - 'python'
      - '--args'
      - 'send_kakao_alert.py'

  # 6. Deploy to Cloud Run Service (Web App)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'golf-ai-web'
      - '--image'
      - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/golf-repo/golf-app'
      - '--region'
      - 'asia-northeast3'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '5000'

  # 7. Deploy to Firebase Hosting
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install -g firebase-tools
        firebase deploy --project $PROJECT_ID --only hosting

images:
  - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/golf-repo/golf-app'

options:
  logging: CLOUD_LOGGING_ONLY
